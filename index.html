<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Habit Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom calendar transitions */
        .tab-btn.active {
            color: #2563eb;
            border-bottom: 2px solid #2563eb;
            font-weight: 600;
        }
        /* Checkbox custom scaling and animation */
        .custom-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center">

    <div class="w-full max-w-md min-h-screen flex flex-col bg-white shadow-lg">
        
        <!-- App Header -->
        <header class="p-5 border-b border-slate-100 flex justify-between items-center bg-white sticky top-0 z-10">
            <div>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
                    <i class="fa-solid fa-square-check text-blue-600"></i> Daily Habits
                </h1>
                <p class="text-xs text-slate-500">Track daily consistency effortlessly</p>
            </div>
            <button id="reset-today-btn" title="Reset Today" class="text-slate-400 hover:text-slate-600 p-2 text-sm rounded-full hover:bg-slate-100 transition">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
        </header>

        <!-- View Switching Tabs -->
        <nav class="flex border-b border-slate-100 bg-slate-50">
            <button id="tab-checklist" class="tab-btn active flex-1 py-3 text-center text-sm text-slate-600 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-list-check"></i> Checklist
            </button>
            <button id="tab-calendar" class="tab-btn flex-1 py-3 text-center text-sm text-slate-600 transition flex items-center justify-center gap-2">
                <i class="fa-regular fa-calendar-days"></i> Calendar
            </button>
        </nav>

        <main class="flex-1 p-5 flex flex-col">
            
            <!-- CHECKLIST VIEW -->
            <section id="view-checklist" class="space-y-6 flex-1 flex flex-col">
                
                <!-- Date Bar Navigation -->
                <div class="flex items-center justify-between bg-slate-100 p-3 rounded-2xl">
                    <button id="prev-day-btn" class="p-2 hover:bg-white rounded-xl text-slate-600 shadow-xs transition">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div class="text-center">
                        <div id="current-date-display" class="font-semibold text-slate-800 text-sm">Today</div>
                        <button id="go-today-btn" class="text-xs text-blue-600 font-medium hover:underline hidden">Jump to Today</button>
                    </div>
                    <button id="next-day-btn" class="p-2 hover:bg-white rounded-xl text-slate-600 shadow-xs transition">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Daily Score Indicator Banner -->
                <div id="score-banner" class="p-4 rounded-2xl flex items-center justify-between border transition-all duration-300">
                    <div>
                        <div class="text-xs uppercase font-bold tracking-wider opacity-80" id="status-label">Status</div>
                        <div class="text-lg font-extrabold" id="status-title">---</div>
                    </div>
                    <div class="text-right">
                        <span id="score-count" class="text-2xl font-black">0/6</span>
                        <div class="text-xs opacity-75">completed</div>
                    </div>
                </div>

                <!-- Habit Checklist Items -->
                <div class="space-y-3 flex-1">
                    
                    <!-- 1) Sleep -->
                    <label class="habit-item flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100/80 rounded-2xl cursor-pointer border border-slate-100 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-moon"></i>
                            </div>
                            <div>
                                <span class="font-semibold text-slate-800 block text-sm">Sleep</span>
                                <span class="text-xs text-slate-400">7-8+ hours quality sleep</span>
                            </div>
                        </div>
                        <input type="checkbox" data-habit="sleep" class="custom-checkbox accent-blue-600 rounded">
                    </label>

                    <!-- 2) Exercise -->
                    <label class="habit-item flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100/80 rounded-2xl cursor-pointer border border-slate-100 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-dumbbell"></i>
                            </div>
                            <div>
                                <span class="font-semibold text-slate-800 block text-sm">Exercise</span>
                                <span class="text-xs text-slate-400">Workout, run or stretch</span>
                            </div>
                        </div>
                        <input type="checkbox" data-habit="exercise" class="custom-checkbox accent-blue-600 rounded">
                    </label>

                    <!-- 3) Food -->
                    <label class="habit-item flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100/80 rounded-2xl cursor-pointer border border-slate-100 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-apple-whole"></i>
                            </div>
                            <div>
                                <span class="font-semibold text-slate-800 block text-sm">Food</span>
                                <span class="text-xs text-slate-400">Healthy meals & nutrition</span>
                            </div>
                        </div>
                        <input type="checkbox" data-habit="food" class="custom-checkbox accent-blue-600 rounded">
                    </label>

                    <!-- 4) Sunlight -->
                    <label class="habit-item flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100/80 rounded-2xl cursor-pointer border border-slate-100 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-sun"></i>
                            </div>
                            <div>
                                <span class="font-semibold text-slate-800 block text-sm">Sunlight</span>
                                <span class="text-xs text-slate-400">15+ mins outdoors</span>
                            </div>
                        </div>
                        <input type="checkbox" data-habit="sunlight" class="custom-checkbox accent-blue-600 rounded">
                    </label>

                    <!-- 5) Bad Habits -->
                    <label class="habit-item flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100/80 rounded-2xl cursor-pointer border border-slate-100 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-ban"></i>
                            </div>
                            <div>
                                <span class="font-semibold text-slate-800 block text-sm">Bad Habits</span>
                                <span class="text-xs text-slate-400">Avoided bad habits today</span>
                            </div>
                        </div>
                        <input type="checkbox" data-habit="bad_habits" class="custom-checkbox accent-blue-600 rounded">
                    </label>

                    <!-- 6) Steps -->
                    <label class="habit-item flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100/80 rounded-2xl cursor-pointer border border-slate-100 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-teal-100 text-teal-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-shoe-prints"></i>
                            </div>
                            <div>
                                <span class="font-semibold text-slate-800 block text-sm">Steps</span>
                                <span class="text-xs text-slate-400">Reached step target</span>
                            </div>
                        </div>
                        <input type="checkbox" data-habit="steps" class="custom-checkbox accent-blue-600 rounded">
                    </label>

                </div>
            </section>

            <!-- CALENDAR VIEW -->
            <section id="view-calendar" class="hidden space-y-5 flex-1 flex flex-col">
                
                <!-- Month Selection Controls -->
                <div class="flex items-center justify-between bg-slate-100 p-3 rounded-2xl">
                    <button id="prev-month-btn" class="p-2 hover:bg-white rounded-xl text-slate-600 shadow-xs transition">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div id="calendar-month-year" class="font-bold text-slate-800 text-base">
                        Month Year
                    </div>
                    <button id="next-month-btn" class="p-2 hover:bg-white rounded-xl text-slate-600 shadow-xs transition">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Legend -->
                <div class="flex justify-around bg-slate-50 p-3 rounded-xl text-xs text-slate-600 border border-slate-100">
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full bg-emerald-500"></span> 5-6 (Great)
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full bg-amber-400"></span> 3-4 (Okay)
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full bg-rose-500"></span> 0-2 (Low)
                    </div>
                </div>

                <!-- Days of Week Header -->
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 py-1">
                    <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                </div>

                <!-- Calendar Days Grid -->
                <div id="calendar-grid" class="grid grid-cols-7 gap-2">
                    <!-- Populated dynamically via JS -->
                </div>
            </section>

        </main>

        <!-- Footer -->
        <footer class="p-4 border-t border-slate-100 text-center text-xs text-slate-400">
            Stored locally in browser &bull; Simple & Fast
        </footer>

    </div>

    <script>
        // List of tracked habit identifiers
        const HABITS = ['sleep', 'exercise', 'food', 'sunlight', 'bad_habits', 'steps'];

        // App State Variables
        let selectedDate = getTodayFormatted(); // Format: "YYYY-MM-DD"
        let calendarYear = new Date().getFullYear();
        let calendarMonth = new Date().getMonth(); // 0-11

        // DOM Element Selectors
        const viewChecklist = document.getElementById('view-checklist');
        const viewCalendar = document.getElementById('view-calendar');
        const tabChecklist = document.getElementById('tab-checklist');
        const tabCalendar = document.getElementById('tab-calendar');
        
        const currentDateDisplay = document.getElementById('current-date-display');
        const goTodayBtn = document.getElementById('go-today-btn');
        const prevDayBtn = document.getElementById('prev-day-btn');
        const nextDayBtn = document.getElementById('next-day-btn');
        const resetTodayBtn = document.getElementById('reset-today-btn');

        const scoreBanner = document.getElementById('score-banner');
        const statusLabel = document.getElementById('status-label');
        const statusTitle = document.getElementById('status-title');
        const scoreCount = document.getElementById('score-count');

        const prevMonthBtn = document.getElementById('prev-month-btn');
        const nextMonthBtn = document.getElementById('next-month-btn');
        const calendarMonthYear = document.getElementById('calendar-month-year');
        const calendarGrid = document.getElementById('calendar-grid');

        // Helper: Format Date object to "YYYY-MM-DD"
        function formatDateKey(dateObj) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Helper: Get Today's Date String
        function getTodayFormatted() {
            return formatDateKey(new Date());
        }

        // LocalStorage Helpers
        function getHabitData(dateKey) {
            const raw = localStorage.getItem(`habit_tracker_${dateKey}`);
            return raw ? JSON.parse(raw) : {};
        }

        function saveHabitData(dateKey, data) {
            localStorage.setItem(`habit_tracker_${dateKey}`, JSON.stringify(data));
        }

        // Calculate count of completed items for a specific date
        function getCompletedCountForDate(dateKey) {
            const data = getHabitData(dateKey);
            let count = 0;
            HABITS.forEach(h => {
                if (data[h] === true) count++;
            });
            return count;
        }

        // UI Render Function: Checklist View
        function renderChecklist() {
            const todayStr = getTodayFormatted();
            
            // Format printable date title
            const [y, m, d] = selectedDate.split('-').map(Number);
            const dateObj = new Date(y, m - 1, d);
            
            const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            const prettyDate = dateObj.toLocaleDateString(undefined, options);

            currentDateDisplay.textContent = (selectedDate === todayStr) ? `Today (${prettyDate})` : prettyDate;
            goTodayBtn.classList.toggle('hidden', selectedDate === todayStr);

            // Load saved state for this day
            const savedData = getHabitData(selectedDate);
            let completedCount = 0;

            // Update checkbox UI state
            document.querySelectorAll('input[data-habit]').forEach(input => {
                const habitKey = input.getAttribute('data-habit');
                const isChecked = !!savedData[habitKey];
                input.checked = isChecked;
                if (isChecked) completedCount++;
            });

            // Update score banner and status pill color
            scoreCount.textContent = `${completedCount}/6`;

            // Color status conditions:
            // Green: 5-6 | Amber: 3-4 | Red: 0-2
            if (completedCount >= 5) {
                scoreBanner.className = "p-4 rounded-2xl flex items-center justify-between bg-emerald-50 text-emerald-800 border-emerald-200 shadow-sm transition-all";
                statusTitle.textContent = "Excellent!";
            } else if (completedCount >= 3) {
                scoreBanner.className = "p-4 rounded-2xl flex items-center justify-between bg-amber-50 text-amber-800 border-amber-200 shadow-sm transition-all";
                statusTitle.textContent = "Getting There";
            } else {
                scoreBanner.className = "p-4 rounded-2xl flex items-center justify-between bg-rose-50 text-rose-800 border-rose-200 shadow-sm transition-all";
                statusTitle.textContent = "Needs Focus";
            }
        }

        // UI Render Function: Calendar View
        function renderCalendar() {
            calendarGrid.innerHTML = '';
            
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            calendarMonthYear.textContent = `${monthNames[calendarMonth]} ${calendarYear}`;

            const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
            const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
            const todayStr = getTodayFormatted();

            // Empty padded slots before the 1st of month
            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "h-12 border border-transparent";
                calendarGrid.appendChild(emptyCell);
            }

            // Fill actual calendar days
            for (let day = 1; day <= daysInMonth; day++) {
                const dayDateObj = new Date(calendarYear, calendarMonth, day);
                const dayKey = formatDateKey(dayDateObj);
                
                const cell = document.createElement('button');
                cell.className = "h-12 rounded-xl flex flex-col items-center justify-center font-medium text-xs relative transition hover:scale-105 active:scale-95 border";

                // Count completed items
                const count = getCompletedCountForDate(dayKey);
                const hasLogged = localStorage.getItem(`habit_tracker_${dayKey}`) !== null;

                // Color logic for calendar cells
                if (!hasLogged) {
                    cell.classList.add('bg-slate-100', 'text-slate-500', 'border-slate-200');
                } else if (count >= 5) {
                    cell.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600', 'shadow-xs');
                } else if (count >= 3) {
                    cell.classList.add('bg-amber-400', 'text-slate-900', 'border-amber-500', 'shadow-xs');
                } else {
                    cell.classList.add('bg-rose-500', 'text-white', 'border-rose-600', 'shadow-xs');
                }

                // Highlight today border
                if (dayKey === todayStr) {
                    cell.classList.add('ring-2', 'ring-blue-600', 'ring-offset-1');
                }

                cell.innerHTML = `
                    <span class="text-sm font-bold">${day}</span>
                    <span class="text-[10px] opacity-80">${hasLogged ? `${count}/6` : '-'}</span>
                `;

                // Click event: navigate to clicked day checklist
                cell.addEventListener('click', () => {
                    selectedDate = dayKey;
                    switchTab('checklist');
                });

                calendarGrid.appendChild(cell);
            }
        }

        // Switch active tab view
        function switchTab(tabName) {
            if (tabName === 'checklist') {
                tabChecklist.classList.add('active');
                tabCalendar.classList.remove('active');
                viewChecklist.classList.remove('hidden');
                viewCalendar.classList.add('hidden');
                renderChecklist();
            } else {
                tabCalendar.classList.add('active');
                tabChecklist.classList.remove('active');
                viewCalendar.classList.remove('hidden');
                viewChecklist.classList.add('hidden');
                renderCalendar();
            }
        }

        // Event Listeners
        tabChecklist.addEventListener('click', () => switchTab('checklist'));
        tabCalendar.addEventListener('click', () => switchTab('calendar'));

        // Handle Checkbox Toggles
        document.querySelectorAll('input[data-habit]').forEach(input => {
            input.addEventListener('change', (e) => {
                const habitKey = e.target.getAttribute('data-habit');
                const currentData = getHabitData(selectedDate);
                currentData[habitKey] = e.target.checked;
                saveHabitData(selectedDate, currentData);
                renderChecklist();
            });
        });

        // Date Step Controls
        prevDayBtn.addEventListener('click', () => {
            const [y, m, d] = selectedDate.split('-').map(Number);
            const dateObj = new Date(y, m - 1, d - 1);
            selectedDate = formatDateKey(dateObj);
            renderChecklist();
        });

        nextDayBtn.addEventListener('click', () => {
            const [y, m, d] = selectedDate.split('-').map(Number);
            const dateObj = new Date(y, m - 1, d + 1);
            selectedDate = formatDateKey(dateObj);
            renderChecklist();
        });

        goTodayBtn.addEventListener('click', () => {
            selectedDate = getTodayFormatted();
            renderChecklist();
        });

        // Reset Today Data
        resetTodayBtn.addEventListener('click', () => {
            if (confirm("Reset habit progress for this date?")) {
                localStorage.removeItem(`habit_tracker_${selectedDate}`);
                renderChecklist();
            }
        });

        // Calendar Month Navigation
        prevMonthBtn.addEventListener('click', () => {
            calendarMonth--;
            if (calendarMonth < 0) {
                calendarMonth = 11;
                calendarYear--;
            }
            renderCalendar();
        });

        nextMonthBtn.addEventListener('click', () => {
            calendarMonth++;
            if (calendarMonth > 11) {
                calendarMonth = 0;
                calendarYear++;
            }
            renderCalendar();
        });

        // App Initialization
        window.onload = function() {
            renderChecklist();
        };
    </script>
</body>
</html>
