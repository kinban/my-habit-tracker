<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Habit Tracker (Cloud Sync)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-btn.active {
            color: #2563eb;
            border-bottom: 2px solid #2563eb;
            font-weight: 600;
        }
        .custom-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center">

    <!-- Main Container -->
    <div class="w-full max-w-md min-h-screen flex flex-col bg-white shadow-lg">
        
        <header class="p-4 border-b border-slate-100 flex justify-between items-center bg-white sticky top-0 z-10">
            <div>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
                    <i class="fa-solid fa-square-check text-blue-600"></i> Daily Habits
                </h1>
                <p class="text-xs text-slate-500" id="sync-status"><i class="fa-solid fa-cloud text-slate-400 mr-1"></i> Checking auth...</p>
            </div>
            
            <!-- Auth User Button / Avatar -->
            <div class="flex items-center gap-2">
                <div id="user-info" class="hidden flex items-center gap-2 text-xs text-slate-600 bg-slate-100 py-1.5 px-3 rounded-full">
                    <span id="user-name" class="font-medium truncate max-w-[100px]">User</span>
                    <button id="logout-btn" title="Sign Out" class="text-slate-400 hover:text-rose-600 transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
                <button id="login-modal-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-1.5 px-3 rounded-full transition shadow-xs flex items-center gap-1">
                    <i class="fa-solid fa-user"></i> Sync Account
                </button>
            </div>
        </header>

        <nav class="flex border-b border-slate-100 bg-slate-50">
            <button id="tab-checklist" class="tab-btn active flex-1 py-3 text-center text-sm text-slate-600 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-list-check"></i> Checklist
            </button>
            <button id="tab-calendar" class="tab-btn flex-1 py-3 text-center text-sm text-slate-600 transition flex items-center justify-center gap-2">
                <i class="fa-regular fa-calendar-days"></i> Calendar
            </button>
        </nav>

        <main class="flex-1 p-5 flex flex-col">
            
            <!-- CHECKLIST VIEW -->
            <section id="view-checklist" class="space-y-6 flex-1 flex flex-col">
                
                <!-- Date Bar Navigation -->
                <div class="flex items-center justify-between bg-slate-100 p-3 rounded-2xl">
                    <button id="prev-day-btn" class="p-2 hover:bg-white rounded-xl text-slate-600 transition">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div class="text-center">
                        <div id="current-date-display" class="font-semibold text-slate-800 text-sm">Today</div>
                        <button id="go-today-btn" class="text-xs text-blue-600 font-medium hover:underline hidden">Jump to Today</button>
                    </div>
                    <button id="next-day-btn" class="p-2 hover:bg-white rounded-xl text-slate-600 transition">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Daily Score Indicator Banner -->
                <div id="score-banner" class="p-4 rounded-2xl flex items-center justify-between border transition-all duration-300">
                    <div>
                        <div class="text-xs uppercase font-bold tracking-wider opacity-80" id="status-label">Status</div>
                        <div class="text-lg font-extrabold" id="status-title">---</div>
                    </div>
                    <div class="text-right">
                        <span id="score-count" class="text-2xl font-black">0/6</span>
                        <div class="text-xs opacity-75">completed</div>
                    </div>
                </div>

                <div class="space-y-3 flex-1">
                    
                    <!-- 1) Sleep -->
                    <label class="habit-item flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100/80 rounded-2xl cursor-pointer border border-slate-100 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-moon"></i>
                            </div>
                            <div>
                                <span class="font-semibold text-slate-800 block text-sm">Sleep</span>
                                <span class="text-xs text-slate-400">7-8+ hours quality sleep</span>
                            </div>
                        </div>
                        <input type="checkbox" data-habit="sleep" class="custom-checkbox accent-blue-600 rounded">
                    </label>

                    <!-- 2) Exercise -->
                    <label class="habit-item flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100/80 rounded-2xl cursor-pointer border border-slate-100 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-dumbbell"></i>
                            </div>
                            <div>
                                <span class="font-semibold text-slate-800 block text-sm">Exercise</span>
                                <span class="text-xs text-slate-400">Workout, run or stretch</span>
                            </div>
                        </div>
                        <input type="checkbox" data-habit="exercise" class="custom-checkbox accent-blue-600 rounded">
                    </label>

                    <!-- 3) Food -->
                    <label class="habit-item flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100/80 rounded-2xl cursor-pointer border border-slate-100 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-apple-whole"></i>
                            </div>
                            <div>
                                <span class="font-semibold text-slate-800 block text-sm">Food</span>
                                <span class="text-xs text-slate-400">Healthy meals & nutrition</span>
                            </div>
                        </div>
                        <input type="checkbox" data-habit="food" class="custom-checkbox accent-blue-600 rounded">
                    </label>

                    <!-- 4) Sunlight -->
                    <label class="habit-item flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100/80 rounded-2xl cursor-pointer border border-slate-100 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-sun"></i>
                            </div>
                            <div>
                                <span class="font-semibold text-slate-800 block text-sm">Sunlight</span>
                                <span class="text-xs text-slate-400">15+ mins outdoors</span>
                            </div>
                        </div>
                        <input type="checkbox" data-habit="sunlight" class="custom-checkbox accent-blue-600 rounded">
                    </label>

                    <!-- 5) Bad Habits -->
                    <label class="habit-item flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100/80 rounded-2xl cursor-pointer border border-slate-100 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-ban"></i>
                            </div>
                            <div>
                                <span class="font-semibold text-slate-800 block text-sm">Bad Habits</span>
                                <span class="text-xs text-slate-400">Avoided bad habits today</span>
                            </div>
                        </div>
                        <input type="checkbox" data-habit="bad_habits" class="custom-checkbox accent-blue-600 rounded">
                    </label>

                    <!-- 6) Steps -->
                    <label class="habit-item flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100/80 rounded-2xl cursor-pointer border border-slate-100 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-teal-100 text-teal-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-shoe-prints"></i>
                            </div>
                            <div>
                                <span class="font-semibold text-slate-800 block text-sm">Steps</span>
                                <span class="text-xs text-slate-400">Reached step target</span>
                            </div>
                        </div>
                        <input type="checkbox" data-habit="steps" class="custom-checkbox accent-blue-600 rounded">
                    </label>

                </div>
            </section>

            <!-- CALENDAR VIEW -->
            <section id="view-calendar" class="hidden space-y-5 flex-1 flex flex-col">
                
                <!-- Month Selection Controls -->
                <div class="flex items-center justify-between bg-slate-100 p-3 rounded-2xl">
                    <button id="prev-month-btn" class="p-2 hover:bg-white rounded-xl text-slate-600 transition">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div id="calendar-month-year" class="font-bold text-slate-800 text-base">
                        Month Year
                    </div>
                    <button id="next-month-btn" class="p-2 hover:bg-white rounded-xl text-slate-600 transition">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Legend -->
                <div class="flex justify-around bg-slate-50 p-3 rounded-xl text-xs text-slate-600 border border-slate-100">
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full bg-emerald-500"></span> 6/6 (Green)
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full bg-amber-400"></span> 4-5 (Amber)
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full bg-rose-500"></span> &le;2 (Red)
                    </div>
                </div>

                <!-- Days of Week Header -->
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 py-1">
                    <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                </div>

                <!-- Calendar Days Grid -->
                <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>
            </section>

        </main>

        <footer class="p-4 border-t border-slate-100 text-center text-xs text-slate-400">
            Realtime Cloud Sync Enabled &bull; Safe & Secure
        </footer>

    </div>

    <!-- Authentication Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-5">
            <div class="text-center space-y-1">
                <h3 class="text-lg font-bold text-slate-900">Sign in to Sync</h3>
                <p class="text-xs text-slate-500">Log in to keep your habits synced seamlessly across all your devices.</p>
            </div>

            <!-- Email / Pass Form -->
            <form id="auth-form" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
                    <input type="email" id="auth-email" required placeholder="you@example.com" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                    <input type="password" id="auth-password" required placeholder="••••••••" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div class="flex gap-2 pt-1">
                    <button type="button" id="email-login-btn" class="flex-1 bg-blue-600 text-white font-semibold py-2 rounded-xl text-xs hover:bg-blue-700 transition">Log In</button>
                    <button type="button" id="email-signup-btn" class="flex-1 bg-slate-100 text-slate-700 font-semibold py-2 rounded-xl text-xs hover:bg-slate-200 transition">Sign Up</button>
                </div>
            </form>

            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-3 text-[10px] text-slate-400 font-bold uppercase tracking-wider">Or</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <!-- Google Login -->
            <button id="google-login-btn" class="w-full py-2.5 px-4 border border-slate-200 rounded-xl text-xs font-medium text-slate-700 flex items-center justify-center gap-2 hover:bg-slate-50 transition">
                <i class="fa-brands fa-google text-red-500 text-sm"></i> Continue with Google
            </button>

            <button id="close-modal-btn" class="w-full text-xs text-slate-400 hover:text-slate-600 font-medium text-center block pt-1">Cancel</button>
        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithCustomToken, 
            signInAnonymously, 
            onAuthStateChanged,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            GoogleAuthProvider,
            signInWithPopup,
            signOut 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            collection, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        /*
         * FIREBASE CONFIGURATION
         * Replace the fallback object below with your actual Firebase project settings if running standalone.
         */
        // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration

// Initialize Firebase
const app = initializeApp(firebaseConfig);
        
   const firebaseConfig = {
  apiKey: "AIzaSyBZJsoRojWEjPEO4YRkfJ67cN3weaRORzI",
  authDomain: "habit-tracker-bed53.firebaseapp.com",
  projectId: "habit-tracker-bed53",
  storageBucket: "habit-tracker-bed53.firebasestorage.app",
  messagingSenderId: "811628622424",
  appId: "1:811628622424:web:b28f9536068803786b502d"
};
            };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'habit-tracker-app';

        // Initialize Firebase Services
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // App State
        const HABITS = ['sleep', 'exercise', 'food', 'sunlight', 'bad_habits', 'steps'];
        let currentUser = null;
        let selectedDate = getTodayFormatted();
        let calendarYear = new Date().getFullYear();
        let calendarMonth = new Date().getMonth();
        let userHabitsMemory = {}; // In-memory cache of habit records by date

        // DOM Elements
        const syncStatus = document.getElementById('sync-status');
        const userInfo = document.getElementById('user-info');
        const userName = document.getElementById('user-name');
        const logoutBtn = document.getElementById('logout-btn');
        const loginModalBtn = document.getElementById('login-modal-btn');
        const authModal = document.getElementById('auth-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');

        const emailLoginBtn = document.getElementById('email-login-btn');
        const emailSignupBtn = document.getElementById('email-signup-btn');
        const googleLoginBtn = document.getElementById('google-login-btn');
        const authEmail = document.getElementById('auth-email');
        const authPassword = document.getElementById('auth-password');

        const viewChecklist = document.getElementById('view-checklist');
        const viewCalendar = document.getElementById('view-calendar');
        const tabChecklist = document.getElementById('tab-checklist');
        const tabCalendar = document.getElementById('tab-calendar');
        
        const currentDateDisplay = document.getElementById('current-date-display');
        const goTodayBtn = document.getElementById('go-today-btn');
        const prevDayBtn = document.getElementById('prev-day-btn');
        const nextDayBtn = document.getElementById('next-day-btn');

        const scoreBanner = document.getElementById('score-banner');
        const statusTitle = document.getElementById('status-title');
        const scoreCount = document.getElementById('score-count');

        const prevMonthBtn = document.getElementById('prev-month-btn');
        const nextMonthBtn = document.getElementById('next-month-btn');
        const calendarMonthYear = document.getElementById('calendar-month-year');
        const calendarGrid = document.getElementById('calendar-grid');

        // Helper Functions
        function formatDateKey(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getTodayFormatted() {
            return formatDateKey(new Date());
        }

        // 1. Initial Authentication Logic
        async function setupAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else if (!auth.currentUser) {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.warn("Auth initialization fallback:", err);
                if (!auth.currentUser) await signInAnonymously(auth);
            }
        }

        // Auth state watcher
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                if (user.isAnonymous) {
                    syncStatus.innerHTML = `<i class="fa-solid fa-cloud text-amber-500 mr-1"></i> Guest Mode`;
                    userInfo.classList.add('hidden');
                    loginModalBtn.classList.remove('hidden');
                } else {
                    syncStatus.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-emerald-500 mr-1"></i> Synced to Cloud`;
                    userName.textContent = user.email || 'User';
                    userInfo.classList.remove('hidden');
                    loginModalBtn.classList.add('hidden');
                }
                attachRealtimeListener(user.uid);
            }
        });

        // 2. Real-time Firestore Sync
        let unsubscribeRealtime = null;

        function attachRealtimeListener(uid) {
            if (unsubscribeRealtime) unsubscribeRealtime();

            // Store in user-specific path: /artifacts/{appId}/users/{userId}/records
            const habitsColRef = collection(db, 'artifacts', appId, 'users', uid, 'records');

            unsubscribeRealtime = onSnapshot(habitsColRef, (snapshot) => {
                userHabitsMemory = {};
                snapshot.forEach((doc) => {
                    userHabitsMemory[doc.id] = doc.data();
                });
                renderChecklist();
                renderCalendar();
            }, (error) => {
                console.error("Firestore sync error:", error);
            });
        }

        // Save habit update to Firestore
        async function saveHabitState(dateKey, habitKey, isChecked) {
            if (!currentUser) return;

            // Optimistic UI update
            if (!userHabitsMemory[dateKey]) userHabitsMemory[dateKey] = {};
            userHabitsMemory[dateKey][habitKey] = isChecked;
            renderChecklist();

            try {
                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'records', dateKey);
                await setDoc(docRef, userHabitsMemory[dateKey], { merge: true });
            } catch (err) {
                console.error("Failed to save habit:", err);
            }
        }

        // UI Render Checklist
        function renderChecklist() {
            const todayStr = getTodayFormatted();
            const [y, m, d] = selectedDate.split('-').map(Number);
            const dateObj = new Date(y, m - 1, d);
            const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            const prettyDate = dateObj.toLocaleDateString(undefined, options);

            currentDateDisplay.textContent = (selectedDate === todayStr) ? `Today (${prettyDate})` : prettyDate;
            goTodayBtn.classList.toggle('hidden', selectedDate === todayStr);

            const savedData = userHabitsMemory[selectedDate] || {};
            let completedCount = 0;

            document.querySelectorAll('input[data-habit]').forEach(input => {
                const habitKey = input.getAttribute('data-habit');
                const isChecked = !!savedData[habitKey];
                input.checked = isChecked;
                if (isChecked) completedCount++;
            });

            scoreCount.textContent = `${completedCount}/6`;

            // Updated color logic requested:
            // Green: All 6 checked | Amber: 4 or 5 checked | Red: 2 or fewer checked
            if (completedCount === 6) {
                scoreBanner.className = "p-4 rounded-2xl flex items-center justify-between bg-emerald-50 text-emerald-800 border-emerald-200 transition-all";
                statusTitle.textContent = "Perfect! (6/6)";
            } else if (completedCount >= 4) {
                scoreBanner.className = "p-4 rounded-2xl flex items-center justify-between bg-amber-50 text-amber-800 border-amber-200 transition-all";
                statusTitle.textContent = "Good Progress";
            } else {
                scoreBanner.className = "p-4 rounded-2xl flex items-center justify-between bg-rose-50 text-rose-800 border-rose-200 transition-all";
                statusTitle.textContent = "Needs Focus";
            }
        }

        // UI Render Calendar
        function renderCalendar() {
            calendarGrid.innerHTML = '';
            
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            calendarMonthYear.textContent = `${monthNames[calendarMonth]} ${calendarYear}`;

            const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
            const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
            const todayStr = getTodayFormatted();

            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "h-12 border border-transparent";
                calendarGrid.appendChild(emptyCell);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dayDateObj = new Date(calendarYear, calendarMonth, day);
                const dayKey = formatDateKey(dayDateObj);
                
                const cell = document.createElement('button');
                cell.className = "h-12 rounded-xl flex flex-col items-center justify-center font-medium text-xs relative transition hover:scale-105 border";

                const dayData = userHabitsMemory[dayKey] || {};
                let count = 0;
                HABITS.forEach(h => { if (dayData[h] === true) count++; });

                const hasData = Object.keys(dayData).length > 0;

                // Color Rules:
                // Green: 6 checked | Amber: 4-5 checked | Red: 2 or fewer checked
                if (!hasData) {
                    cell.classList.add('bg-slate-100', 'text-slate-500', 'border-slate-200');
                } else if (count === 6) {
                    cell.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
                } else if (count >= 4) {
                    cell.classList.add('bg-amber-400', 'text-slate-900', 'border-amber-500');
                } else {
                    cell.classList.add('bg-rose-500', 'text-white', 'border-rose-600');
                }

                if (dayKey === todayStr) {
                    cell.classList.add('ring-2', 'ring-blue-600', 'ring-offset-1');
                }

                cell.innerHTML = `
                    <span class="text-sm font-bold">${day}</span>
                    <span class="text-[10px] opacity-85">${hasData ? `${count}/6` : '-'}</span>
                `;

                cell.addEventListener('click', () => {
                    selectedDate = dayKey;
                    switchTab('checklist');
                });

                calendarGrid.appendChild(cell);
            }
        }

        // View Switching
        function switchTab(tabName) {
            if (tabName === 'checklist') {
                tabChecklist.classList.add('active');
                tabCalendar.classList.remove('active');
                viewChecklist.classList.remove('hidden');
                viewCalendar.classList.add('hidden');
                renderChecklist();
            } else {
                tabCalendar.classList.add('active');
                tabChecklist.classList.remove('active');
                viewCalendar.classList.remove('hidden');
                viewChecklist.classList.add('hidden');
                renderCalendar();
            }
        }

        // Checkbox events
        document.querySelectorAll('input[data-habit]').forEach(input => {
            input.addEventListener('change', (e) => {
                const habitKey = e.target.getAttribute('data-habit');
                saveHabitState(selectedDate, habitKey, e.target.checked);
            });
        });

        // Tab events
        tabChecklist.addEventListener('click', () => switchTab('checklist'));
        tabCalendar.addEventListener('click', () => switchTab('calendar'));

        // Date navigation
        prevDayBtn.addEventListener('click', () => {
            const [y, m, d] = selectedDate.split('-').map(Number);
            selectedDate = formatDateKey(new Date(y, m - 1, d - 1));
            renderChecklist();
        });

        nextDayBtn.addEventListener('click', () => {
            const [y, m, d] = selectedDate.split('-').map(Number);
            selectedDate = formatDateKey(new Date(y, m - 1, d + 1));
            renderChecklist();
        });

        goTodayBtn.addEventListener('click', () => {
            selectedDate = getTodayFormatted();
            renderChecklist();
        });

        prevMonthBtn.addEventListener('click', () => {
            calendarMonth--;
            if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
            renderCalendar();
        });

        nextMonthBtn.addEventListener('click', () => {
            calendarMonth++;
            if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
            renderCalendar();
        });

        // Auth Modal Handlers
        loginModalBtn.addEventListener('click', () => authModal.classList.remove('hidden'));
        closeModalBtn.addEventListener('click', () => authModal.classList.add('hidden'));

        emailLoginBtn.addEventListener('click', async () => {
            try {
                await signInWithEmailAndPassword(auth, authEmail.value, authPassword.value);
                authModal.classList.add('hidden');
            } catch (err) {
                alert("Login Error: " + err.message);
            }
        });

        emailSignupBtn.addEventListener('click', async () => {
            try {
                await createUserWithEmailAndPassword(auth, authEmail.value, authPassword.value);
                authModal.classList.add('hidden');
            } catch (err) {
                alert("Signup Error: " + err.message);
            }
        });

        googleLoginBtn.addEventListener('click', async () => {
            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
                authModal.classList.add('hidden');
            } catch (err) {
                alert("Google Sign-in Error: " + err.message);
            }
        });

        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            await signInAnonymously(auth);
        });

        // Start App
        window.onload = () => {
            setupAuth();
            renderChecklist();
        };
    </script>
</body>
</html>
