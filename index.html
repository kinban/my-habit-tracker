<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker - Daily Progress & Sync</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-active {
            color: #4f46e5;
            border-bottom: 2px solid #4f46e5;
            font-weight: 600;
        }
        .habit-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .habit-card:hover {
            transform: translateY(-1px);
        }
        /* Custom scrollbar for calendar if needed */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center">

    <!-- App Container -->
    <div class="w-full max-w-lg min-h-screen flex flex-col bg-white shadow-xl border-x border-slate-100">
        
        <!-- Header -->
        <header class="p-4 border-b border-slate-100 flex justify-between items-center bg-white sticky top-0 z-20">
            <div>
                <h1 class="text-xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
                    <i class="fa-solid fa-square-check text-indigo-600"></i> HabitTracker
                </h1>
                <div class="flex items-center gap-2 mt-0.5">
                    <span id="syncBadge" class="inline-flex items-center gap-1 text-[11px] font-medium text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">
                        <i class="fa-solid fa-hard-drive"></i> Local Storage
                    </span>
                </div>
            </div>
            
            <!-- Auth / User Controls -->
            <div id="authContainer">
                <button id="googleSignInBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-2 px-3.5 rounded-xl transition shadow-sm flex items-center gap-2">
                    <i class="fa-brands fa-google"></i> Sign In
                </button>
                <div id="userInfo" class="hidden flex items-center gap-2">
                    <img id="userAvatar" src="https://placehold.co/32x32/6366f1/ffffff?text=U" alt="User Avatar" class="w-8 h-8 rounded-full border border-indigo-200 object-cover">
                    <div class="text-left hidden sm:block">
                        <p id="userName" class="text-xs font-bold text-slate-800 truncate max-w-[90px]">User</p>
                        <p class="text-[10px] text-slate-400">Synced</p>
                    </div>
                    <button id="signOutBtn" title="Sign Out" class="p-2 text-slate-400 hover:text-rose-600 transition text-sm">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- View Navigation Tabs -->
        <nav class="flex border-b border-slate-100 bg-slate-50/80 sticky top-[65px] z-10 backdrop-blur-md">
            <button id="tabChecklist" class="tab-active flex-1 py-3 text-center text-sm transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-list-check"></i> Checklist
            </button>
            <button id="tabCalendar" class="text-slate-500 hover:text-slate-800 flex-1 py-3 text-center text-sm transition flex items-center justify-center gap-2">
                <i class="fa-regular fa-calendar-days"></i> Calendar View
            </button>
        </nav>

        <!-- Toast / Message Notification Banner -->
        <div id="toastMessage" class="hidden mx-4 mt-3 p-3 rounded-xl text-xs font-medium bg-slate-800 text-white flex items-center justify-between shadow-md">
            <span id="toastText">Notification message</span>
            <button id="toastClose" class="text-slate-400 hover:text-white ml-2"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- Main Content View -->
        <main class="flex-1 p-4 sm:p-5 flex flex-col space-y-6">
            
            <!-- 1. CHECKLIST VIEW -->
            <section id="viewChecklist" class="space-y-5 flex-1 flex flex-col">
                
                <!-- Date Bar Navigation -->
                <div class="flex items-center justify-between bg-slate-100/80 p-2.5 rounded-2xl border border-slate-200/60">
                    <button id="prevDayBtn" class="p-2 hover:bg-white rounded-xl text-slate-600 transition shadow-xs" title="Previous Day">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div class="text-center">
                        <div id="dateDisplayMain" class="font-bold text-slate-800 text-sm">Today</div>
                        <div id="dateDisplaySub" class="text-[11px] text-slate-500 font-medium">Loading date...</div>
                    </div>
                    <div class="flex items-center gap-1">
                        <button id="todayBtn" class="hidden text-xs bg-indigo-50 text-indigo-600 font-semibold px-2.5 py-1 rounded-lg hover:bg-indigo-100 transition mr-1">
                            Today
                        </button>
                        <button id="nextDayBtn" class="p-2 hover:bg-white rounded-xl text-slate-600 transition shadow-xs" title="Next Day">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Daily Score & Completion Progress Badge Banner -->
                <div id="scoreBanner" class="p-4 rounded-2xl flex items-center justify-between border bg-slate-50 border-slate-200 transition-all duration-300">
                    <div>
                        <div class="text-[10px] uppercase font-bold tracking-wider text-slate-500">Daily Status</div>
                        <div class="text-base font-extrabold text-slate-800" id="statusTitle">0 / 6 Completed</div>
                        <p id="statusSubtitle" class="text-xs text-slate-500 mt-0.5">Start checking off your habits!</p>
                    </div>
                    <div class="text-right">
                        <span id="scoreBadge" class="inline-block px-3 py-1.5 rounded-xl text-sm font-black bg-slate-200 text-slate-700">
                            0%
                        </span>
                    </div>
                </div>

                <!-- Habit List Items -->
                <div id="habitList" class="space-y-3 flex-1">
                    <!-- Dynamically populated checklist items -->
                </div>
            </section>

            <!-- 2. CALENDAR VIEW -->
            <section id="viewCalendar" class="hidden space-y-5 flex-1 flex flex-col">
                
                <!-- Month Controls -->
                <div class="flex items-center justify-between bg-slate-100/80 p-2.5 rounded-2xl border border-slate-200/60">
                    <button id="prevMonthBtn" class="p-2 hover:bg-white rounded-xl text-slate-600 transition shadow-xs">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div id="calendarMonthLabel" class="font-bold text-slate-800 text-base">
                        Month Year
                    </div>
                    <button id="nextMonthBtn" class="p-2 hover:bg-white rounded-xl text-slate-600 transition shadow-xs">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Color Legend -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-100 text-xs font-medium text-slate-600">
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-md bg-emerald-500 inline-block shadow-xs"></span>
                        <span>6/6 (Green)</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-md bg-amber-400 inline-block shadow-xs"></span>
                        <span>4-5 (Amber)</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-md bg-rose-500 inline-block shadow-xs"></span>
                        <span>1-3 (Red)</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-md bg-slate-200 inline-block"></span>
                        <span>0 Checked</span>
                    </div>
                </div>

                <!-- Weekdays Header -->
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-slate-400 uppercase tracking-wider py-1">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>

                <!-- Calendar Days Grid -->
                <div id="calendarGrid" class="grid grid-cols-7 gap-1.5"></div>
            </section>

        </main>

        <footer class="p-4 border-t border-slate-100 text-center text-xs text-slate-400 bg-white">
            Daily Habit Tracker &bull; Powered by Firebase & Local Storage
        </footer>
    </div>

    <!-- Modular Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            collection, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Exact provided Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBZJsoRojWEjPEO4YRkfJ67cN3weaRORzI",
            authDomain: "habit-tracker-bed53.firebaseapp.com",
            projectId: "habit-tracker-bed53",
            storageBucket: "habit-tracker-bed53.firebasestorage.app",
            messagingSenderId: "811628622424",
            appId: "1:811628622424:web:b28f9536068803786b502d"
        };

        // Initialize Firebase Services safely
        let app, auth, db, provider;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            provider = new GoogleAuthProvider();
        } catch (e) {
            console.error("Firebase init error:", e);
        }

        // Habit definitions
        const HABITS = [
            { id: "sleep", label: "Sleep", desc: "7-8+ hours quality rest", icon: "fa-moon", color: "text-indigo-600", bg: "bg-indigo-50", border: "border-indigo-100" },
            { id: "exercise", label: "Exercise", desc: "Workout, run or active sport", icon: "fa-dumbbell", color: "text-orange-600", bg: "bg-orange-50", border: "border-orange-100" },
            { id: "food", label: "Food", desc: "Healthy balanced nutrition", icon: "fa-apple-whole", color: "text-emerald-600", bg: "bg-emerald-50", border: "border-emerald-100" },
            { id: "sunlight", label: "Sunlight", desc: "15+ mins natural daylight", icon: "fa-sun", color: "text-amber-600", bg: "bg-amber-50", border: "border-amber-100" },
            { id: "bad_habits", label: "Bad Habits Avoided", desc: "Stayed disciplined today", icon: "fa-shield-halved", color: "text-rose-600", bg: "bg-rose-50", border: "border-rose-100" },
            { id: "steps", label: "Steps Target", desc: "Hit daily walking goal", icon: "fa-person-walking", color: "text-teal-600", bg: "bg-teal-50", border: "border-teal-100" }
        ];

        // State variables
        let currentUser = null;
        let selectedDate = new Date();
        let currentCalendarMonth = new Date().getMonth();
        let currentCalendarYear = new Date().getFullYear();
        let habitDataStore = {}; // Local memory store { 'YYYY-MM-DD': { habitId: true/false } }
        let unsubscribeFirestore = null;

        // UI DOM Elements
        const syncBadge = document.getElementById("syncBadge");
        const googleSignInBtn = document.getElementById("googleSignInBtn");
        const userInfo = document.getElementById("userInfo");
        const userAvatar = document.getElementById("userAvatar");
        const userName = document.getElementById("userName");
        const signOutBtn = document.getElementById("signOutBtn");

        const tabChecklist = document.getElementById("tabChecklist");
        const tabCalendar = document.getElementById("tabCalendar");
        const viewChecklist = document.getElementById("viewChecklist");
        const viewCalendar = document.getElementById("viewCalendar");

        const dateDisplayMain = document.getElementById("dateDisplayMain");
        const dateDisplaySub = document.getElementById("dateDisplaySub");
        const prevDayBtn = document.getElementById("prevDayBtn");
        const nextDayBtn = document.getElementById("nextDayBtn");
        const todayBtn = document.getElementById("todayBtn");

        const scoreBanner = document.getElementById("scoreBanner");
        const statusTitle = document.getElementById("statusTitle");
        const statusSubtitle = document.getElementById("statusSubtitle");
        const scoreBadge = document.getElementById("scoreBadge");
        const habitList = document.getElementById("habitList");

        const calendarMonthLabel = document.getElementById("calendarMonthLabel");
        const prevMonthBtn = document.getElementById("prevMonthBtn");
        const nextMonthBtn = document.getElementById("nextMonthBtn");
        const calendarGrid = document.getElementById("calendarGrid");

        const toastMessage = document.getElementById("toastMessage");
        const toastText = document.getElementById("toastText");
        const toastClose = document.getElementById("toastClose");

        function showToast(msg, duration = 3000) {
            toastText.textContent = msg;
            toastToastMessage.classList.remove("hidden");
            setTimeout(() => {
                toastMessage.classList.add("hidden");
            }, duration);
        }
        const toastToastMessage = toastMessage;
        toastClose.addEventListener("click", () => toastMessage.classList.add("hidden"));

        function formatDateKey(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function isToday(dateObj) {
            return formatDateKey(dateObj) === formatDateKey(new Date());
        }

        // Load local storage cache
        function loadLocalStorage() {
            try {
                const stored = localStorage.getItem("habitTrackerData");
                if (stored) {
                    habitDataStore = JSON.parse(stored);
                }
            } catch (e) {
                console.error("Local storage load error:", e);
                habitDataStore = {};
            }
        }

        // Save local storage cache
        function saveLocalStorage() {
            try {
                localStorage.setItem("habitTrackerData", JSON.stringify(habitDataStore));
            } catch (e) {
                console.error("Local storage save error:", e);
            }
        }

        function renderChecklist() {
            const dateKey = formatDateKey(selectedDate);
            const dayHabits = habitDataStore[dateKey] || {};

            // Render Date Titles
            if (isToday(selectedDate)) {
                dateDisplayMain.textContent = "Today";
                todayBtn.classList.add("hidden");
            } else {
                dateDisplayMain.textContent = selectedDate.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
                todayBtn.classList.remove("hidden");
            }

            dateDisplaySub.textContent = selectedDate.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });

            // Render Habit List
            habitList.innerHTML = "";
            let completedCount = 0;

            HABITS.forEach(habit => {
                const isChecked = !!dayHabits[habit.id];
                if (isChecked) completedCount++;

                const habitCard = document.createElement("label");
                habitCard.className = `habit-card flex items-center justify-between p-3.5 sm:p-4 rounded-2xl border cursor-pointer transition select-none ${
                    isChecked 
                        ? "bg-indigo-50/70 border-indigo-200 text-indigo-950 shadow-2xs" 
                        : "bg-slate-50 border-slate-200/80 hover:bg-slate-100/80 text-slate-800"
                }`;

                habitCard.innerHTML = `
                    <div class="flex items-center gap-3 sm:gap-4">
                        <div class="w-10 h-10 rounded-xl ${habit.bg} ${habit.color} border ${habit.border} flex items-center justify-center text-lg flex-shrink-0 shadow-2xs">
                            <i class="fa-solid ${habit.icon}"></i>
                        </div>
                        <div>
                            <span class="font-bold text-sm block leading-snug">${habit.label}</span>
                            <span class="text-xs text-slate-400 block">${habit.desc}</span>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" data-id="${habit.id}" class="w-5 h-5 rounded-md text-indigo-600 focus:ring-indigo-500 accent-indigo-600 cursor-pointer" ${isChecked ? "checked" : ""}>
                    </div>
                `;

                const checkbox = habitCard.querySelector("input[type='checkbox']");
                checkbox.addEventListener("change", (e) => {
                    toggleHabit(dateKey, habit.id, e.target.checked);
                });

                habitList.appendChild(habitCard);
            });

            // Update Score Banner & Badge
            const percentage = Math.round((completedCount / HABITS.length) * 100);
            statusTitle.textContent = `${completedCount} of ${HABITS.length} Completed`;

            if (completedCount === 6) {
                scoreBanner.className = "p-4 rounded-2xl flex items-center justify-between border bg-emerald-50 border-emerald-200 text-emerald-900 transition-all duration-300";
                statusSubtitle.textContent = "Perfect score! Outstanding achievement!";
                scoreBadge.className = "px-3.5 py-1.5 rounded-xl text-sm font-black bg-emerald-500 text-white shadow-xs";
                scoreBadge.textContent = "100%";
            } else if (completedCount >= 4) {
                scoreBanner.className = "p-4 rounded-2xl flex items-center justify-between border bg-amber-50 border-amber-200 text-amber-900 transition-all duration-300";
                statusSubtitle.textContent = "Great progress! Keep going!";
                scoreBadge.className = "px-3.5 py-1.5 rounded-xl text-sm font-black bg-amber-400 text-slate-900 shadow-xs";
                scoreBadge.textContent = `${percentage}%`;
            } else if (completedCount >= 1) {
                scoreBanner.className = "p-4 rounded-2xl flex items-center justify-between border bg-rose-50 border-rose-200 text-rose-900 transition-all duration-300";
                statusSubtitle.textContent = "Good start! Aim for 4+ habits today.";
                scoreBadge.className = "px-3.5 py-1.5 rounded-xl text-sm font-black bg-rose-500 text-white shadow-xs";
                scoreBadge.textContent = `${percentage}%`;
            } else {
                scoreBanner.className = "p-4 rounded-2xl flex items-center justify-between border bg-slate-50 border-slate-200 text-slate-800 transition-all duration-300";
                statusSubtitle.textContent = "No habits checked off yet today.";
                scoreBadge.className = "px-3.5 py-1.5 rounded-xl text-sm font-black bg-slate-200 text-slate-700";
                scoreBadge.textContent = "0%";
            }

            renderCalendar();
        }

        function renderCalendar() {
            calendarGrid.innerHTML = "";

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            calendarMonthLabel.textContent = `${monthNames[currentCalendarMonth]} ${currentCalendarYear}`;

            const firstDayIndex = new Date(currentCalendarYear, currentCalendarMonth, 1).getDay();
            const totalDays = new Date(currentCalendarYear, currentCalendarMonth + 1, 0).getDate();
            const todayKey = formatDateKey(new Date());

            // Empty slots for alignment
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement("div");
                emptyCell.className = "h-11 sm:h-12";
                calendarGrid.appendChild(emptyCell);
            }

            // Days cells
            for (let day = 1; day <= totalDays; day++) {
                const cellDate = new Date(currentCalendarYear, currentCalendarMonth, day);
                const dayKey = formatDateKey(cellDate);
                const dayHabits = habitDataStore[dayKey] || {};

                let completedCount = 0;
                HABITS.forEach(h => {
                    if (dayHabits[h.id] === true) completedCount++;
                });

                const cell = document.createElement("button");
                
                /*
                 * Calendar Color Coding Rules:
                 * - Emerald Green: All 6 checked
                 * - Amber Yellow: 4 or 5 checked
                 * - Rose Red: 1 to 3 checked
                 * - Default gray: 0 checked / unlogged.
                 */
                let colorClasses = "bg-slate-100 text-slate-600 hover:bg-slate-200 border-slate-200";
                
                if (completedCount === 6) {
                    colorClasses = "bg-emerald-500 text-white font-bold border-emerald-600 shadow-xs";
                } else if (completedCount === 4 || completedCount === 5) {
                    colorClasses = "bg-amber-400 text-slate-950 font-bold border-amber-500 shadow-xs";
                } else if (completedCount >= 1 && completedCount <= 3) {
                    colorClasses = "bg-rose-500 text-white font-bold border-rose-600 shadow-xs";
                }

                const isSelected = (dayKey === formatDateKey(selectedDate));
                const selectionRing = isSelected ? "ring-2 ring-indigo-600 ring-offset-2" : "";
                const isCurrentDay = (dayKey === todayKey);

                cell.className = `h-11 sm:h-12 rounded-xl border flex flex-col items-center justify-center relative transition duration-150 ${colorClasses} ${selectionRing}`;
                
                cell.innerHTML = `
                    <span class="text-xs sm:text-sm font-bold ${isCurrentDay && completedCount === 0 ? 'underline decoration-indigo-600 decoration-2 font-extrabold' : ''}">${day}</span>
                    <span class="text-[9px] opacity-80 font-semibold">${completedCount > 0 ? `${completedCount}/6` : ''}</span>
                `;

                cell.addEventListener("click", () => {
                    selectedDate = cellDate;
                    switchTab("checklist");
                });

                calendarGrid.appendChild(cell);
            }
        }

        async function toggleHabit(dateKey, habitId, isChecked) {
            if (!habitDataStore[dateKey]) {
                habitDataStore[dateKey] = {};
            }
            habitDataStore[dateKey][habitId] = isChecked;

            saveLocalStorage();
            renderChecklist();

            // Sync to Firestore if authenticated
            if (currentUser && db) {
                try {
                    const docRef = doc(db, "users", currentUser.uid, "habits", dateKey);
                    await setDoc(docRef, habitDataStore[dateKey], { merge: true });
                } catch (err) {
                    console.error("Firestore update error:", err);
                    showToast("Failed to sync to cloud. Local state saved.");
                }
            }
        }

        function setupRealtimeSync(uid) {
            if (unsubscribeFirestore) unsubscribeFirestore();
            if (!db) return;

            try {
                const habitsColRef = collection(db, "users", uid, "habits");
                unsubscribeFirestore = onSnapshot(habitsColRef, (snapshot) => {
                    snapshot.forEach((docSnap) => {
                        habitDataStore[docSnap.id] = docSnap.data();
                    });
                    saveLocalStorage();
                    renderChecklist();
                }, (error) => {
                    console.error("Firestore snapshot error:", error);
                });
            } catch (err) {
                console.error("Realtime sync attach error:", err);
            }
        }

        function switchTab(targetTab) {
            if (targetTab === "checklist") {
                tabChecklist.className = "tab-active flex-1 py-3 text-center text-sm transition flex items-center justify-center gap-2";
                tabCalendar.className = "text-slate-500 hover:text-slate-800 flex-1 py-3 text-center text-sm transition flex items-center justify-center gap-2";
                viewChecklist.classList.remove("hidden");
                viewCalendar.classList.add("hidden");
                renderChecklist();
            } else {
                tabCalendar.className = "tab-active flex-1 py-3 text-center text-sm transition flex items-center justify-center gap-2";
                tabChecklist.className = "text-slate-500 hover:text-slate-800 flex-1 py-3 text-center text-sm transition flex items-center justify-center gap-2";
                viewCalendar.classList.remove("hidden");
                viewChecklist.classList.add("hidden");
                renderCalendar();
            }
        }

        tabChecklist.addEventListener("click", () => switchTab("checklist"));
        tabCalendar.addEventListener("click", () => switchTab("calendar"));

        // Date Controls
        prevDayBtn.addEventListener("click", () => {
            selectedDate.setDate(selectedDate.getDate() - 1);
            renderChecklist();
        });

        nextDayBtn.addEventListener("click", () => {
            selectedDate.setDate(selectedDate.getDate() + 1);
            renderChecklist();
        });

        todayBtn.addEventListener("click", () => {
            selectedDate = new Date();
            renderChecklist();
        });

        prevMonthBtn.addEventListener("click", () => {
            currentCalendarMonth--;
            if (currentCalendarMonth < 0) {
                currentCalendarMonth = 11;
                currentCalendarYear--;
            }
            renderCalendar();
        });

        nextMonthBtn.addEventListener("click", () => {
            currentCalendarMonth++;
            if (currentCalendarMonth > 11) {
                currentCalendarMonth = 0;
                currentCalendarYear++;
            }
            renderCalendar();
        });

        googleSignInBtn.addEventListener("click", async () => {
            if (!auth || !provider) {
                showToast("Firebase Auth unavailable.");
                return;
            }
            try {
                await signInWithPopup(auth, provider);
                showToast("Signed in successfully!");
            } catch (err) {
                console.error("Sign in error:", err);
                showToast("Sign in popup cancelled or blocked.");
            }
        });

        signOutBtn.addEventListener("click", async () => {
            if (!auth) return;
            try {
                await signOut(auth);
                showToast("Signed out. Using local storage.");
            } catch (err) {
                console.error("Sign out error:", err);
            }
        });

        // Firebase Auth State Listener
        if (auth) {
            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) {
                    googleSignInBtn.classList.add("hidden");
                    userInfo.classList.remove("hidden");
                    userName.textContent = user.displayName || "User";
                    if (user.photoURL) {
                        userAvatar.src = user.photoURL;
                    }
                    syncBadge.className = "inline-flex items-center gap-1 text-[11px] font-medium text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200";
                    syncBadge.innerHTML = `<i class="fa-solid fa-cloud-check"></i> Cloud Synced`;

                    setupRealtimeSync(user.uid);
                } else {
                    googleSignInBtn.classList.remove("hidden");
                    userInfo.classList.add("hidden");
                    syncBadge.className = "inline-flex items-center gap-1 text-[11px] font-medium text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200";
                    syncBadge.innerHTML = `<i class="fa-solid fa-hard-drive"></i> Local Storage`;

                    if (unsubscribeFirestore) {
                        unsubscribeFirestore();
                        unsubscribeFirestore = null;
                    }
                }
            });
        }

        // Initialize App
        loadLocalStorage();
        renderChecklist();
    </script>
</body>
</html>
